[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-ps"
version = "0.1.0"
description = "Graph Topology Augmentation for Prioritized Sweeping"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "gymnasium>=1.0",
    "minigrid>=2.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

# MuJoCo Reacher: works with the default gymnasium>=1.0 + mujoco>=3.1 stack.
reacher = ["mujoco>=3.1", "gymnasium>=1.0"]

# Safety-Gymnasium CarGoal requires a pinned older stack that conflicts with
# the default gymnasium>=1.0 env.  Install in a separate venv or via conda:
#
#   pip install "safety-gymnasium==1.0.0" "gymnasium==0.26.3" \
#               "mujoco==2.3.3" "gymnasium-robotics==1.2.2" "pygame==2.1.0"
#
# Do NOT mix with the default environment.
cargoal = [
    "safety-gymnasium==1.0.0",
    "gymnasium==0.26.3",
    "mujoco==2.3.3",
    "gymnasium-robotics==1.2.2",
    "pygame==2.1.0",
]

# Install everything except CarGoal (recommended for most experiments)
full = [
    "mujoco>=3.1",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
