env: garnet
n_states: 100
n_actions: 10
branching: 4
reward_support: 5   # ~|S|/20
gamma: 0.99
n_shifts: 20
seeds: 1000
eps_metric: 0.1
budgets: [10, 50, 100]   # |S|/10, |S|/2, |S|

# GTA-PS hyperparameters (grid searched per env)
alpha: 0.5
beta: 1.0
beta1: 1.0
beta2: 0.1
alpha_exp: 1.0

# SLEM estimation
arnoldi_k: 15
slem_recompute_every: null   # defaults to ceil(sqrt(|S|))
