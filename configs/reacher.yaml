env: reacher
n_bins: 16
n_rollout_steps: 20000
gamma: 0.95
n_shifts: 10
seeds: 100

# budgets: |S|/4, |S|, 4|S|
budgets: [64, 256, 1024]

# Disturbance modes (sweep in RQ4/RQ6)
